<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Bestie! ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle at center, #230438 0%, #05010a 100%);
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32'><text y='28' font-size='28'>✨</text></svg>"), auto;
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.6;
            z-index: 0;
            animation: drift 10s infinite alternate ease-in-out;
        }
        .orb-1 { width: 40vw; height: 40vw; background: #ff1493; top: -10%; left: -10%; }
        .orb-2 { width: 35vw; height: 35vw; background: #8a2be2; bottom: -10%; right: -10%; animation-delay: -5s; }

        @keyframes drift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        #main-container {
            text-align: center;
            z-index: 10;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .glow-text {
            font-family: 'Dancing Script', cursive;
            font-size: 4.5rem;
            color: #ffb6c1;
            text-shadow: 0 0 10px #ff69b4, 0 0 20px #ff1493, 0 0 40px #ff1493;
            animation: pulse 2s infinite;
            margin: 0 0 30px 0;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        #magic-btn {
            background: linear-gradient(45deg, #ff9a9e, #fecfef);
            border: none;
            padding: 15px 35px;
            font-size: 1.2rem;
            border-radius: 30px;
            color: #111;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 5px 25px rgba(255, 105, 180, 0.5);
            transition: transform 0.1s;
        }
        #magic-btn:hover {
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32'><text y='28' font-size='28'>🪄</text></svg>"), auto;
        }

        #magic-btn:active { transform: scale(0.90); }

        #game-link {
            display: inline-block;
            margin-top: 25px;
            color: #ffb6c1;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            border: 1px solid rgba(255, 182, 193, 0.3);
            padding: 10px 20px;
            border-radius: 20px;
            transition: 0.3s;
        }
        #game-link:hover {
            background: rgba(255, 182, 193, 0.1);
            border-color: #ffb6c1;
            box-shadow: 0 0 15px rgba(255, 182, 193, 0.5);
        }

        #animation-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        .memory-bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            color: #ff1493;
            padding: 15px 25px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: floatUp 4s ease-out forwards;
            opacity: 0;
        }

        .polaroid {
            position: absolute;
            background: white;
            padding: 10px 10px 40px 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            animation: popIn 3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            opacity: 0;
            width: 200px; height: 200px;
        }

        .polaroid img {
            width: 100%; height: 100%;
            object-fit: cover;
            border-radius: 4px;
        }

        @keyframes floatUp {
            0% { transform: translateY(110vh) scale(0.5); opacity: 0; }
            15% { opacity: 1; }
            85% { opacity: 1; }
            100% { transform: translateY(-20vh) scale(1.2); opacity: 0; }
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0) rotate(-30deg); opacity: 0; }
            20% { transform: translate(-50%, -50%) scale(1.2) rotate(10deg); opacity: 1; }
            80% { transform: translate(-50%, -50%) scale(1) rotate(-5deg); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.5) rotate(20deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <!-- The glowing background orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div id="main-container">
        <h1 class="glow-text">Happy Birthday Jiyuuu! 💖</h1>
        <button id="magic-btn">Tap for Magic ✨</button>
        <br>
        <a href="https://spanduxd.github.io/hbdgame/game.html" id="game-link">Secret🤫</a>
    </div>
    
    <div id="animation-container"></div>

    <script>
        const btn = document.getElementById('magic-btn');
        const container = document.getElementById('animation-container');
        const photos = ["1.jpg", "3.jpg","4.jpg","14.jpg","9.jpg","8.jpg","11.jpg","17.jpg","10.jpg","7.jpg"];
        const memories = [
            "Happy 18th to the girl who makes my life 10x crazier and 100x better.",
            "You are the absolute best! 💖",
            "You’re officially 18 but you’ll always be my stupid little bestie 😭",
            "Happy Birthday gorgeous! ✨",
            "your endless rants and laughter are my favorite things in the world.",
            "18 still u my lil baby😭💖",
            "You deserve the whole world! 🌎",
            "Besties for life 🤞",
            "U r 18 now par pagalpanti toh hamesha rahegi 😭💖",
        ];

        btn.addEventListener('click', () => {
            const isPolaroid = Math.random() > 0.5;
            if (isPolaroid) {
                createPolaroid();
            } else {
                createBubble();
            }
        });

        function createBubble() {
            const el = document.createElement('div');
            el.classList.add('memory-bubble');
            el.innerText = memories[Math.floor(Math.random() * memories.length)];
            el.style.left = Math.random() * 70 + 15 + 'vw'; 
            container.appendChild(el);
            setTimeout(() => { el.remove(); }, 4000);
        }

        function createPolaroid() {
            const el = document.createElement('div');
            el.classList.add('polaroid');
            const randomImg = photos[Math.floor(Math.random() * photos.length)];
            el.innerHTML = `<img src="${randomImg}" alt="Besties">`;
            el.style.left = '50%'; el.style.top = '50%';
            container.appendChild(el);
            setTimeout(() => { el.remove(); }, 3000);
        }
    </script>
</body>
</html>
